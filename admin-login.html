<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Nexa – Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#1a1533; --card:#ffffff;
    --primary:#5c3df4; --primary-dark:#4528d4; --primary-soft:#ede9ff;
    --accent:#a78bfa; --text:#1a1533; --muted:#7b7694;
    --border:#e3e0f5; --success:#16a34a; --error:#dc2626;
  }
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--text);
    background-image:radial-gradient(ellipse at 20% 20%,rgba(92,61,244,0.15) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(167,139,250,0.1) 0%,transparent 50%);
  }

  .login-card{background:var(--card);border-radius:24px;padding:36px 28px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.4);animation:slideUp 0.4s ease;}
  @keyframes slideUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}

  .logo{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:20px;}
  .logo-icon{width:52px;height:52px;border-radius:16px;background:var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(92,61,244,0.4);}
  .logo-icon svg{width:26px;height:26px;color:#fff;stroke-width:2.5;}
  .logo-text{font-size:1.6rem;font-weight:800;letter-spacing:-0.5px;}
  .logo-text span{color:var(--primary);}
  .logo-badge{display:inline-block;background:var(--accent);color:#1e1445;font-size:0.6rem;font-weight:800;padding:3px 10px;border-radius:50px;margin-top:2px;}

  h1{font-size:1.3rem;font-weight:800;text-align:center;margin-bottom:4px;}
  .subtitle{font-size:0.85rem;color:var(--muted);text-align:center;margin-bottom:28px;}

  .error-msg{display:none;background:#fee2e2;border:1px solid #fecaca;color:#b91c1c;border-radius:12px;padding:12px 14px;font-size:0.82rem;font-weight:600;margin-bottom:16px;align-items:center;gap:8px;}
  .error-msg.show{display:flex;}
  .error-msg svg{width:18px;height:18px;flex-shrink:0;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:0.72rem;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;}
  .field-input{position:relative;}
  .field-input .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#b3aed4;display:flex;pointer-events:none;}
  .field-input .icon svg{width:18px;height:18px;}
  .field-input input{width:100%;height:52px;background:#f8f7ff;border:2px solid var(--border);border-radius:14px;padding:0 14px 0 44px;font-family:inherit;font-size:0.92rem;color:var(--text);outline:none;transition:all 0.2s;}
  .field-input input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(92,61,244,0.08);}
  .field-input input.error{border-color:var(--error);background:#fef2f2;}
  .toggle-pw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#b3aed4;padding:6px;display:flex;}
  .toggle-pw:hover{color:var(--primary);}
  .toggle-pw svg{width:18px;height:18px;}

  .btn-login{width:100%;height:54px;background:var(--primary);color:#fff;font-family:inherit;font-size:1rem;font-weight:700;border:none;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.2s;box-shadow:0 4px 16px rgba(92,61,244,0.3);}
  .btn-login:hover{background:var(--primary-dark);transform:translateY(-1px);box-shadow:0 6px 20px rgba(92,61,244,0.4);}
  .btn-login:active{transform:scale(0.98);}
  .btn-login:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
  .btn-login svg{width:18px;height:18px;}
  .spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;animation:spin 600ms linear infinite;display:none;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .back-link{text-align:center;margin-top:20px;}
  .back-link a{color:var(--muted);font-size:0.85rem;text-decoration:none;font-weight:600;transition:color 0.2s;}
  .back-link a:hover{color:var(--primary);}

  /* Toast Notifications */
  .toast-container{position:fixed;top:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:10px;max-width:350px;}
  .toast{background:var(--card);border-radius:12px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,0.15);display:flex;align-items:center;gap:12px;animation:slideIn 0.3s ease;border-left:4px solid;}
  .toast.success{border-left-color:var(--success);}
  .toast.error{border-left-color:var(--error);}
  .toast.info{border-left-color:var(--primary);}
  @keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
  @keyframes slideOut{from{transform:translateX(0);opacity:1;}to{transform:translateX(100%);opacity:0;}}
  .toast-icon{width:22px;height:22px;flex-shrink:0;}
  .toast-content{flex:1;}
  .toast-title{font-weight:700;font-size:0.88rem;color:var(--text);margin-bottom:2px;}
  .toast-message{font-size:0.8rem;color:var(--muted);}
  .toast-close{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;flex-shrink:0;}

  @media(max-width:480px){
    .login-card{padding:28px 20px;}
    .toast-container{left:20px;right:20px;max-width:none;}
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </div>
    <div>
      <div class="logo-text">Nex<span>a</span></div>
      <span class="logo-badge">🔐 ADMIN PANEL</span>
    </div>
  </div>

  <h1>Admin Login</h1>
  <p class="subtitle">Enter your admin credentials to continue</p>

  <div class="error-msg" id="errorMsg">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="errorText">Invalid credentials</span>
  </div>

  <div class="field">
    <label>Email Address</label>
    <div class="field-input">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      </span>
      <input type="email" id="email" placeholder="admin@nexa.com" autocomplete="email" />
    </div>
  </div>

  <div class="field">
    <label>Password</label>
    <div class="field-input">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      </span>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      <button class="toggle-pw" onclick="togglePassword()" tabindex="-1" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>

  <button class="btn-login" id="loginBtn" onclick="handleLogin()">
    <span id="btnText">Login to Admin Panel</span>
    <div class="spinner" id="spinner"></div>
    <svg id="btnArrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
  </button>

  <div class="back-link">
    <a href="dashboard.html">← Back to User Dashboard</a>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ✅ UPDATED FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyAXVLeBN6rROvG6tEUN5WD8X1SZ4hatBxA",
    authDomain: "nexa-co.firebaseapp.com",
    projectId: "nexa-co",
    storageBucket: "nexa-co.firebasestorage.app",
    messagingSenderId: "345722583751",
    appId: "1:345722583751:web:b987628aa77bce38629ce2"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Toast notification system
  function showToast(type, title, message, duration = 4000) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    
    const icons = {
      success: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`,
      error: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
      info: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#5c3df4" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`
    };
    
    toast.innerHTML = `
      ${icons[type] || icons.info}
      <div class="toast-content">
        <div class="toast-title">${title}</div>
        <div class="toast-message">${message}</div>
      </div>
      <button class="toast-close" onclick="this.parentElement.remove()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    `;
    
    container.appendChild(toast);
    
    setTimeout(() => {
      toast.style.animation = 'slideOut 0.3s ease';
      setTimeout(() => toast.remove(), 300);
    }, duration);
  }

  // Check if already logged in as admin
  onAuthStateChanged(auth, async (user) => {
    if (user && sessionStorage.getItem('nexa_admin_logged') === '1') {
      const userSnap = await getDoc(doc(db, 'users', user.uid));
      const userData = userSnap.exists() ? userSnap.data() : {};
      if (userData.role === 'admin' || userData.isAdmin === true) {
        window.location.href = 'admin-dashboard.html';
        return;
      }
    }
  });

  function showError(msg) {
    const err = document.getElementById('errorMsg');
    document.getElementById('errorText').textContent = msg;
    err.classList.add('show');
  }

  function hideError() {
    document.getElementById('errorMsg').classList.remove('show');
  }

  function setLoading(loading) {
    const btn = document.getElementById('loginBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    const btnArrow = document.getElementById('btnArrow');
    
    btn.disabled = loading;
    spinner.style.display = loading ? 'block' : 'none';
    btnArrow.style.display = loading ? 'none' : 'block';
    btnText.textContent = loading ? 'Verifying...' : 'Login to Admin Panel';
  }

  window.handleLogin = async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    
    hideError();
    
    if (!email || !password) {
      showError('Please enter both email and password');
      showToast('warning', 'Missing Fields', 'Please enter your email and password.');
      return;
    }
    
    if (!email.includes('@')) {
      showError('Please enter a valid email address');
      return;
    }
    
    setLoading(true);
    
    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      const userSnap = await getDoc(doc(db, 'users', cred.user.uid));
      const userData = userSnap.exists() ? userSnap.data() : {};
      
      if (userData.role === 'admin' || userData.isAdmin === true) {
        sessionStorage.setItem('nexa_admin_logged', '1');
        sessionStorage.setItem('nexa_admin_uid', cred.user.uid);
        sessionStorage.setItem('nexa_admin_email', email);
        
        showToast('success', 'Welcome Admin! 🎉', 'Login successful. Redirecting to dashboard...');
        setTimeout(() => {
          window.location.href = 'admin-dashboard.html';
        }, 1000);
      } else {
        await signOut(auth);
        showError('Access denied. Admin privileges required.');
        showToast('error', 'Access Denied', 'This account does not have admin privileges.');
        setLoading(false);
      }
    } catch (e) {
      console.error('Login error:', e);
      
      const errorMap = {
        'auth/user-not-found': 'No account found with this email',
        'auth/wrong-password': 'Incorrect password',
        'auth/invalid-email': 'Invalid email address',
        'auth/invalid-credential': 'Invalid email or password',
        'auth/too-many-requests': 'Too many failed attempts. Try later.',
        'auth/network-request-failed': 'Network error. Check connection.'
      };
      
      showError(errorMap[e.code] || 'Login failed. Please try again.');
      showToast('error', 'Login Failed', errorMap[e.code] || 'Please check your credentials.');
      setLoading(false);
    }
  };

  // Enter key to submit
  document.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') handleLogin();
  });

  // Clear error on input
  document.getElementById('email').addEventListener('input', hideError);
  document.getElementById('password').addEventListener('input', hideError);

  // Toggle password visibility
  window.togglePassword = () => {
    const input = document.getElementById('password');
    const btn = document.querySelector('.toggle-pw');
    const isText = input.type === 'text';
    input.type = isText ? 'password' : 'text';
    btn.innerHTML = isText
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
  };
</script>
</body>
</html>
