<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Nexa – Admin Transactions</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#f4f3fa; --card:#ffffff;
    --primary:#5c3df4; --primary-dark:#4528d4; --primary-soft:#ede9ff;
    --accent:#a78bfa; --accent-gold:#f59e0b; --text:#1a1533; --muted:#7b7694;
    --border:#e3e0f5; --input-bg:#f8f7ff;
    --success:#16a34a; --error:#dc2626; --warn:#d97706;
  }
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);padding-bottom:70px;min-height:100vh;}

  .topbar{background:var(--card);padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;}
  .topbar-left{display:flex;align-items:center;gap:10px;}
  .logo-icon{width:40px;height:40px;border-radius:12px;background:var(--primary);display:flex;align-items:center;justify-content:center;}
  .logo-icon svg{width:20px;height:20px;color:#fff;stroke-width:2.5;}
  .logo-text{font-size:1.2rem;font-weight:800;}
  .logo-text span{color:var(--primary);}
  .admin-badge{background:var(--accent-gold);color:#1e1445;font-size:0.6rem;font-weight:800;padding:3px 10px;border-radius:50px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .logout-btn{background:#fee2e2;color:#b91c1c;border:none;border-radius:10px;padding:8px 16px;font-size:0.75rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;}
  .logout-btn:hover{background:#fecaca;}
  .logout-btn svg{width:14px;height:14px;}

  main{padding:16px;max-width:900px;margin:0 auto;}

  .nav-menu{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:20px;}
  .nav-item{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;transition:all 0.2s;text-decoration:none;color:var(--text);}
  .nav-item:hover{border-color:var(--primary);box-shadow:0 4px 12px rgba(92,61,244,0.1);}
  .nav-item.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .nav-item .ni-icon{font-size:1.5rem;margin-bottom:6px;}
  .nav-item .ni-label{font-size:0.65rem;font-weight:700;}

  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
  .stat-mini{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:12px;text-align:center;cursor:pointer;}
  .stat-mini:hover{border-color:var(--primary);}
  .stat-mini .sv{font-size:1.1rem;font-weight:800;color:var(--primary);}
  .stat-mini .sl{font-size:0.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;margin-top:2px;}
  .stat-mini.warning .sv{color:var(--warn);}
  .stat-mini.success .sv{color:var(--success);}
  .stat-mini.error .sv{color:var(--error);}

  .filter-tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;}
  .filter-tabs::-webkit-scrollbar{display:none;}
  .filter-tab{flex-shrink:0;padding:8px 16px;border-radius:50px;font-size:0.75rem;font-weight:700;cursor:pointer;background:var(--card);border:2px solid var(--border);color:var(--muted);transition:all 0.2s;white-space:nowrap;}
  .filter-tab.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .filter-tab:hover:not(.active){border-color:var(--primary);color:var(--primary);}

  .search-bar{display:flex;gap:8px;margin-bottom:16px;}
  .search-input{flex:1;height:46px;background:var(--card);border:2px solid var(--border);border-radius:12px;padding:0 14px;font-family:inherit;font-size:0.85rem;color:var(--text);outline:none;}
  .search-input:focus{border-color:var(--primary);}
  .search-btn{height:46px;padding:0 20px;background:var(--primary);color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:0.85rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .search-btn svg{width:16px;height:16px;}

  .trans-list{display:flex;flex-direction:column;gap:10px;}
  .trans-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:14px;transition:all 0.2s;}
  .trans-card:hover{border-color:var(--primary);box-shadow:0 4px 12px rgba(92,61,244,0.08);}
  .trans-card.admin-fund{border-left:4px solid var(--success);}
  .trans-card.admin-deduct{border-left:4px solid var(--error);}
  .trans-card.deposit{border-left:4px solid var(--primary);}
  .trans-card.withdrawal{border-left:4px solid var(--warn);}
  .trans-card.investment{border-left:4px solid var(--accent-gold);}
  .trans-card.roi{border-left:4px solid #0d9488;}
  .trans-card.referral{border-left:4px solid #f59e0b;}

  .trans-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .trans-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
  .trans-icon.admin-fund{background:#dcfce7;}
  .trans-icon.admin-deduct{background:#fee2e2;}
  .trans-icon.deposit{background:var(--primary-soft);}
  .trans-icon.withdrawal{background:#fef3c7;}
  .trans-icon.investment{background:#dbeafe;}
  .trans-icon.roi{background:#ccfbf1;}
  .trans-icon.referral{background:#fef3c7;}

  .trans-info{flex:1;min-width:0;}
  .trans-user{font-size:0.85rem;font-weight:700;color:var(--text);word-break:break-all;}
  .trans-type{font-size:0.72rem;color:var(--muted);margin-top:2px;}
  .trans-status{font-size:0.65rem;font-weight:700;padding:3px 10px;border-radius:50px;flex-shrink:0;}
  .trans-status.pending{background:#fef3c7;color:#92400e;}
  .trans-status.approved{background:#dcfce7;color:#15803d;}
  .trans-status.rejected{background:#fee2e2;color:#b91c1c;}
  .trans-status.completed{background:#dbeafe;color:#1e40af;}

  .trans-details{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;}
  .trans-detail{background:var(--input-bg);border-radius:10px;padding:8px;text-align:center;}
  .trans-detail .tdl{font-size:0.6rem;color:var(--muted);text-transform:uppercase;margin-bottom:2px;}
  .trans-detail .tdv{font-size:0.78rem;font-weight:700;color:var(--text);}

  .trans-amount{text-align:right;flex-shrink:0;}
  .trans-amount .amt{font-size:0.95rem;font-weight:800;}
  .trans-amount .amt.credit{color:var(--success);}
  .trans-amount .amt.debit{color:var(--error);}

  .loading-state{text-align:center;padding:40px 20px;color:var(--muted);}
  .loading-spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty-state svg{width:60px;height:60px;color:var(--border);margin-bottom:16px;}
  .empty-state h3{font-size:1.1rem;font-weight:700;color:var(--text);margin-bottom:6px;}
  .empty-state p{font-size:0.85rem;}

  .toast-container{position:fixed;top:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:10px;max-width:350px;}
  .toast{background:var(--card);border-radius:12px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,0.15);display:flex;align-items:center;gap:12px;animation:slideIn 0.3s ease;border-left:4px solid;}
  .toast.success{border-left-color:var(--success);}
  .toast.error{border-left-color:var(--error);}
  .toast.info{border-left-color:var(--primary);}
  .toast.warning{border-left-color:var(--accent-gold);}
  @keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
  @keyframes slideOut{from{transform:translateX(0);opacity:1;}to{transform:translateX(100%);opacity:0;}}
  .toast-icon{width:22px;height:22px;flex-shrink:0;}
  .toast-content{flex:1;}
  .toast-title{font-weight:700;font-size:0.85rem;color:var(--text);margin-bottom:2px;}
  .toast-message{font-size:0.78rem;color:var(--muted);}
  .toast-close{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;flex-shrink:0;}

  @media(max-width:768px){
    .nav-menu{grid-template-columns:repeat(3,1fr);}
    .stats-row{grid-template-columns:repeat(2,1fr);}
  }
  @media(max-width:480px){
    .toast-container{left:20px;right:20px;max-width:none;}
    .nav-menu{grid-template-columns:repeat(2,1fr);}
    .trans-details{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
    <span class="logo-text">Nex<span>a</span></span>
    <span class="admin-badge">🔐 ADMIN</span>
  </div>
  <button class="logout-btn" onclick="confirmLogout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout</button>
</div>

<main>
  <div class="nav-menu">
    <a href="admin-dashboard.html" class="nav-item"><div class="ni-icon">📊</div><div class="ni-label">Dashboard</div></a>
    <a href="admin-users.html" class="nav-item"><div class="ni-icon">👥</div><div class="ni-label">Users</div></a>
    <a href="admin-deposits.html" class="nav-item"><div class="ni-icon">📥</div><div class="ni-label">Deposits</div></a>
    <a href="admin-withdrawals.html" class="nav-item"><div class="ni-icon">📤</div><div class="ni-label">Withdrawals</div></a>
    <a href="admin-investments.html" class="nav-item"><div class="ni-icon">💼</div><div class="ni-label">Investments</div></a>
    <a href="admin-transactions.html" class="nav-item active"><div class="ni-icon">📋</div><div class="ni-label">Transactions</div></a>
  </div>

  <div class="stats-row">
    <div class="stat-mini" onclick="setFilter('all')"><div class="sv" id="statTotal">0</div><div class="sl">Total</div></div>
    <div class="stat-mini success" onclick="setFilter('admin-fund')"><div class="sv" id="statFunds">0</div><div class="sl">Funds</div></div>
    <div class="stat-mini error" onclick="setFilter('admin-deduct')"><div class="sv" id="statDeducts">0</div><div class="sl">Deductions</div></div>
    <div class="stat-mini warning" onclick="setFilter('pending')"><div class="sv" id="statPending">0</div><div class="sl">Pending</div></div>
  </div>

  <div class="filter-tabs">
    <div class="filter-tab active" data-filter="all" onclick="setFilter('all')">All</div>
    <div class="filter-tab" data-filter="admin-fund" onclick="setFilter('admin-fund')">Admin Funds</div>
    <div class="filter-tab" data-filter="admin-deduct" onclick="setFilter('admin-deduct')">Admin Deductions</div>
    <div class="filter-tab" data-filter="deposit" onclick="setFilter('deposit')">Deposits</div>
    <div class="filter-tab" data-filter="withdrawal" onclick="setFilter('withdrawal')">Withdrawals</div>
    <div class="filter-tab" data-filter="investment" onclick="setFilter('investment')">Investments</div>
    <div class="filter-tab" data-filter="roi" onclick="setFilter('roi')">ROI</div>
    <div class="filter-tab" data-filter="referral" onclick="setFilter('referral')">Referrals</div>
  </div>

  <div class="search-bar">
    <input type="text" class="search-input" id="searchInput" placeholder="Search by user email..." oninput="filterTransactions()" />
    <button class="search-btn" onclick="filterTransactions()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Search</button>
  </div>

  <div class="loading-state" id="loadingState">
    <div class="loading-spinner"></div>
    <p>Loading transactions...</p>
  </div>

  <div class="trans-list" id="transList" style="display:none;"></div>

  <div class="empty-state" id="emptyState" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>
    <h3>No transactions found</h3>
    <p id="emptyMsg">No transactions match your filter.</p>
  </div>
</main>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAXVLeBN6rROvG6tEUN5WD8X1SZ4hatBxA",
    authDomain: "nexa-co.firebaseapp.com",
    projectId: "nexa-co",
    storageBucket: "nexa-co.firebasestorage.app",
    messagingSenderId: "345722583751",
    appId: "1:345722583751:web:b987628aa77bce38629ce2"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let allTransactions = [];
  let currentFilter = 'all';
  let usersMap = {};

  const fu = n => (Number(n)||0).toFixed(2);
  const ff = n => Math.round(n||0).toLocaleString();

  function showToast(type, title, message, duration = 4000) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    const icons = {
      success: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`,
      error: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
      info: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#5c3df4" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/></svg>`,
      warning: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>`
    };
    toast.innerHTML = `
      ${icons[type] || icons.info}
      <div class="toast-content"><div class="toast-title">${title}</div><div class="toast-message">${message}</div></div>
      <button class="toast-close" onclick="this.parentElement.remove()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    `;
    container.appendChild(toast);
    setTimeout(() => { toast.style.animation = 'slideOut 0.3s ease'; setTimeout(() => toast.remove(), 300); }, duration);
  }

  function getTs(ts) {
    if (!ts) return 0;
    if (ts.toMillis) return ts.toMillis();
    if (ts.seconds) return ts.seconds * 1000;
    if (ts instanceof Date) return ts.getTime();
    if (typeof ts === 'number') return ts;
    return 0;
  }

  function formatDate(ts) {
    const ms = getTs(ts);
    if (!ms) return '—';
    return new Date(ms).toLocaleDateString('en-US', {day:'numeric', month:'short', year:'numeric'}) + ' ' + new Date(ms).toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'});
  }

  function getIcon(type) {
    if (type === 'admin-fund') return 'admin-fund';
    if (type === 'admin-deduct') return 'admin-deduct';
    if (type === 'deposit') return 'deposit';
    if (type === 'withdrawal') return 'withdrawal';
    if (type === 'investment') return 'investment';
    if (type === 'roi') return 'roi';
    if (type === 'referral') return 'referral';
    return 'deposit';
  }

  function getIconEmoji(type) {
    const icons = {
      'admin-fund': '💰',
      'admin-deduct': '➖',
      'deposit': '📥',
      'withdrawal': '📤',
      'investment': '💼',
      'roi': '💎',
      'referral': '🎁'
    };
    return icons[type] || '📄';
  }

  function getTypeLabel(type) {
    const labels = {
      'admin-fund': 'Admin Funded',
      'admin-deduct': 'Admin Deducted',
      'deposit': 'Deposit',
      'withdrawal': 'Withdrawal',
      'investment': 'Investment',
      'roi': 'ROI Payout',
      'referral': 'Referral Bonus'
    };
    return labels[type] || type;
  }

  function getAmountType(type) {
    if (type === 'admin-fund' || type === 'roi' || type === 'referral') return 'credit';
    if (type === 'admin-deduct' || type === 'deposit' || type === 'withdrawal' || type === 'investment') return 'debit';
    return 'debit';
  }

  window.setFilter = (filter) => {
    currentFilter = filter;
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.filter === filter);
    });
    filterTransactions();
  };

  window.filterTransactions = () => {
    const search = document.getElementById('searchInput').value.trim().toLowerCase();
    let filtered = allTransactions;
    
    if (currentFilter !== 'all') {
      if (currentFilter === 'pending') {
        filtered = filtered.filter(tx => tx.status === 'pending');
      } else {
        filtered = filtered.filter(tx => tx.type === currentFilter);
      }
    }
    
    if (search) {
      filtered = filtered.filter(tx => (tx.userEmail || '').toLowerCase().includes(search));
    }
    
    renderTransactions(filtered);
  };

  function renderTransactions(transactions) {
    const list = document.getElementById('transList');
    const empty = document.getElementById('emptyState');

    if (transactions.length === 0) {
      list.style.display = 'none';
      empty.style.display = 'block';
      document.getElementById('emptyMsg').textContent = 'No transactions found.';
      return;
    }

    empty.style.display = 'none';
    list.style.display = 'flex';

    list.innerHTML = transactions.map(tx => {
      const amountType = getAmountType(tx.type);
      const amountDisplay = tx.currency === 'NGN' ? '₦' + ff(tx.amount) : '$' + fu(tx.amount);
      const statusClass = tx.status || 'completed';
      
      return `
        <div class="trans-card ${tx.type}">
          <div class="trans-head">
            <div class="trans-icon ${tx.type}">${getIconEmoji(tx.type)}</div>
            <div class="trans-info">
              <div class="trans-user">${tx.userEmail || 'Unknown'}</div>
              <div class="trans-type">${getTypeLabel(tx.type)}</div>
            </div>
            <span class="trans-status ${statusClass}">${(tx.status || 'completed').charAt(0).toUpperCase() + (tx.status || 'completed').slice(1)}</span>
          </div>
          <div class="trans-details">
            <div class="trans-detail"><div class="tdl">Amount</div><div class="tdv">${amountDisplay}</div></div>
            <div class="trans-detail"><div class="tdl">Date</div><div class="tdv">${formatDate(tx.createdAt)}</div></div>
            <div class="trans-detail"><div class="tdl">Detail</div><div class="tdv">${tx.detail || '—'}</div></div>
          </div>
          <div class="trans-amount">
            <div class="amt ${amountType}">${amountType === 'credit' ? '+' : '-'}${amountDisplay}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  async function loadTransactions() {
    const loading = document.getElementById('loadingState');
    loading.style.display = 'block';
    
    try {
      allTransactions = [];
      usersMap = {};

      // Fetch all users to build email map
      const usersSnap = await getDocs(collection(db, 'users'));
      usersSnap.forEach(doc => {
        usersMap[doc.id] = doc.data().email || 'Unknown';
      });

      // ✅ Fetch deposits
      const depSnap = await getDocs(collection(db, 'deposits'));
      depSnap.forEach(doc => {
        const d = doc.data();
        allTransactions.push({
          id: doc.id,
          type: 'deposit',
          userEmail: usersMap[d.userId] || d.userEmail || 'Unknown',
          amount: d.amount || 0,
          currency: d.currency || 'USDT',
          status: d.status || 'pending',
          createdAt: d.createdAt,
          detail: d.depositType === 'NGN_BANK_TRANSFER' ? 'Bank Transfer' : 'Crypto'
        });
      });

      // ✅ Fetch withdrawals
      const withSnap = await getDocs(collection(db, 'withdrawals'));
      withSnap.forEach(doc => {
        const d = doc.data();
        allTransactions.push({
          id: doc.id,
          type: 'withdrawal',
          userEmail: usersMap[d.userId] || d.userEmail || 'Unknown',
          amount: d.amount || 0,
          currency: d.currency || 'USDT',
          status: d.status || 'pending',
          createdAt: d.createdAt,
          detail: d.type === 'bank' ? 'Bank Transfer' : 'USDT Wallet'
        });
      });

      // ✅ Fetch investments
      const invSnap = await getDocs(collection(db, 'investments'));
      invSnap.forEach(doc => {
        const d = doc.data();
        allTransactions.push({
          id: doc.id,
          type: 'investment',
          userEmail: usersMap[d.userId] || d.userEmail || 'Unknown',
          amount: d.amount || 0,
          currency: 'USDT',
          status: d.status || 'active',
          createdAt: d.createdAt,
          detail: d.planName || 'Plan'
        });
        
        // Add ROI from investment
        if (d.totalPaidOut && d.totalPaidOut > 0) {
          allTransactions.push({
            id: doc.id + '-roi',
            type: 'roi',
            userEmail: usersMap[d.userId] || d.userEmail || 'Unknown',
            amount: d.totalPaidOut || 0,
            currency: 'USDT',
            status: 'completed',
            createdAt: d.lastPayoutDate || d.createdAt,
            detail: d.planName || 'Plan'
          });
        }
      });

      // ✅ Fetch referral logs (as upline)
      const refSnap = await getDocs(collection(db, 'referralLogs'));
      refSnap.forEach(doc => {
        const d = doc.data();
        allTransactions.push({
          id: doc.id,
          type: 'referral',
          userEmail: usersMap[d.uplineId] || d.uplineId || 'Unknown',
          amount: d.bonus || 0,
          currency: 'USDT',
          status: 'completed',
          createdAt: d.createdAt,
          detail: `Level ${d.level || 1} · ${d.planName || 'Investment'}`
        });
      });

      // ✅ Fetch admin transactions (funds/deductions)
      const adminSnap = await getDocs(collection(db, 'adminTransactions'));
      adminSnap.forEach(doc => {
        const d = doc.data();
        allTransactions.push({
          id: doc.id,
          type: d.action === 'fund' ? 'admin-fund' : 'admin-deduct',
          userEmail: usersMap[d.userId] || d.userEmail || 'Unknown',
          amount: d.amount || 0,
          currency: 'USDT',
          status: 'completed',
          createdAt: d.createdAt,
          detail: d.walletType === 'deposit' ? 'Deposit Wallet' : 'Withdrawal Wallet'
        });
      });

      // Sort by date newest first
      allTransactions.sort((a, b) => getTs(b.createdAt) - getTs(a.createdAt));

      // Update stats
      const funds = allTransactions.filter(tx => tx.type === 'admin-fund').length;
      const deducts = allTransactions.filter(tx => tx.type === 'admin-deduct').length;
      const pending = allTransactions.filter(tx => tx.status === 'pending').length;
      
      document.getElementById('statTotal').textContent = allTransactions.length;
      document.getElementById('statFunds').textContent = funds;
      document.getElementById('statDeducts').textContent = deducts;
      document.getElementById('statPending').textContent = pending;

      loading.style.display = 'none';
      filterTransactions();
      
      if (allTransactions.length > 0) {
        showToast('success', 'Transactions Loaded', `Found ${allTransactions.length} transaction(s).`);
      }
    } catch (e) {
      console.error('Load transactions error:', e);
      loading.style.display = 'none';
      showToast('error', 'Error', 'Failed to load transactions: ' + e.message);
    }
  }

  window.confirmLogout = async () => {
    try {
      await signOut(auth);
      sessionStorage.removeItem('nexa_admin_logged');
      sessionStorage.removeItem('nexa_admin_uid');
      window.location.href = 'admin-login.html';
    } catch (e) {
      showToast('error', 'Error', 'Logout failed.');
    }
  };

  onAuthStateChanged(auth, async (user) => {
    if (!user || sessionStorage.getItem('nexa_admin_logged') !== '1') {
      window.location.href = 'admin-login.html';
      return;
    }
    
    const userSnap = await getDoc(doc(db, 'users', user.uid));
    const userData = userSnap.exists() ? userSnap.data() : {};
    if (userData.role !== 'admin' && userData.isAdmin !== true) {
      window.location.href = 'admin-login.html';
      return;
    }
    
    loadTransactions();
  });

  setInterval(() => {
    if (sessionStorage.getItem('nexa_admin_logged') === '1') loadTransactions();
  }, 120000);
</script>
</body>
</html>
