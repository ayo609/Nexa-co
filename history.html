<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Nexa – Transaction History</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#f4f3fa; --card:#ffffff;
    --primary:#5c3df4; --primary-dark:#4528d4; --primary-soft:#ede9ff;
    --accent:#a78bfa; --accent-gold:#f59e0b; --text:#1a1533; --muted:#7b7694;
    --border:#e3e0f5; --input-bg:#f8f7ff;
    --dark-card:linear-gradient(135deg,#1e1445 0%,#3b1fa8 100%);
    --shadow:0 8px 32px -8px rgba(92,61,244,0.18);
    --success:#16a34a; --error:#dc2626; --warn:#d97706;
  }
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);padding-bottom:84px;min-height:100vh;
    background-image:radial-gradient(ellipse at 20% 10%,rgba(92,61,244,0.03) 0%,transparent 50%);
  }

  .topbar{background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;}
  .back-btn{width:38px;height:38px;border-radius:50%;background:var(--input-bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;color:var(--text);flex-shrink:0;transition:all 0.2s;}
  .back-btn:hover{background:var(--primary-soft);}
  .back-btn svg{width:18px;height:18px;}
  .topbar h1{font-size:1.05rem;font-weight:800;}
  .topbar p{font-size:0.75rem;color:var(--muted);}

  main{padding:16px;max-width:480px;margin:0 auto;}

  .filter-tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
  .filter-tabs::-webkit-scrollbar{display:none;}
  .filter-tab{flex-shrink:0;padding:9px 18px;border-radius:50px;font-size:0.82rem;font-weight:700;cursor:pointer;background:var(--card);border:2px solid var(--border);color:var(--muted);transition:all 0.2s;white-space:nowrap;}
  .filter-tab.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(92,61,244,0.3);}
  .filter-tab:hover:not(.active){border-color:var(--primary);color:var(--primary);}

  .stats-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .stat-mini{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:12px;text-align:center;}
  .stat-mini .sv{font-size:1.1rem;font-weight:800;color:var(--primary);}
  .stat-mini .sl{font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;margin-top:2px;}

  .trans-list{display:flex;flex-direction:column;gap:10px;}
  .trans-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;transition:all 0.2s;}
  .trans-card:hover{border-color:var(--primary);box-shadow:0 4px 12px rgba(92,61,244,0.08);}
  
  .trans-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.3rem;}
  .trans-icon.deposit{background:#dcfce7;color:#15803d;}
  .trans-icon.withdrawal{background:#fee2e2;color:#b91c1c;}
  .trans-icon.investment{background:var(--primary-soft);color:var(--primary);}
  .trans-icon.roi{background:#d1fae5;color:#059669;}
  .trans-icon.referral{background:#fef3c7;color:#92400e;}
  .trans-icon.welcome{background:#ccfbf1;color:#0f766e;}

  .trans-info{flex:1;min-width:0;}
  .trans-title{font-size:0.88rem;font-weight:700;color:var(--text);margin-bottom:2px;}
  .trans-date{font-size:0.72rem;color:var(--muted);}
  
  .trans-amount{text-align:right;flex-shrink:0;}
  .trans-amount .amt{font-size:0.95rem;font-weight:800;}
  .trans-amount .amt.credit{color:var(--success);}
  .trans-amount .amt.debit{color:var(--error);}
  .trans-amount .status{font-size:0.65rem;font-weight:700;padding:3px 8px;border-radius:50px;margin-top:3px;display:inline-block;}
  .status.pending{background:#fef3c7;color:#92400e;}
  .status.approved{background:#dcfce7;color:#15803d;}
  .status.rejected{background:#fee2e2;color:#b91c1c;}
  .status.completed{background:#dbeafe;color:#1e40af;}
  .status.active{background:#dcfce7;color:#15803d;}
  .status.locked{background:#fef3c7;color:#92400e;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty-state svg{width:60px;height:60px;color:var(--border);margin-bottom:16px;}
  .empty-state h3{font-size:1.1rem;font-weight:700;color:var(--text);margin-bottom:6px;}
  .empty-state p{font-size:0.85rem;}

  .loading-state{text-align:center;padding:40px 20px;color:var(--muted);}
  .loading-spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Toast Notifications */
  .toast-container{position:fixed;top:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:10px;max-width:350px;}
  .toast{background:var(--card);border-radius:12px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,0.15);display:flex;align-items:center;gap:12px;animation:slideIn 0.3s ease;border-left:4px solid;position:relative;overflow:hidden;}
  .toast.success{border-left-color:var(--success);}
  .toast.error{border-left-color:var(--error);}
  .toast.info{border-left-color:var(--primary);}
  .toast.warning{border-left-color:var(--accent-gold);}
  @keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
  @keyframes slideOut{from{transform:translateX(0);opacity:1;}to{transform:translateX(100%);opacity:0;}}
  .toast-icon{width:24px;height:24px;flex-shrink:0;}
  .toast-content{flex:1;}
  .toast-title{font-weight:700;font-size:0.9rem;color:var(--text);margin-bottom:2px;}
  .toast-message{font-size:0.85rem;color:var(--muted);}
  .toast-close{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;flex-shrink:0;}

  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;z-index:30;padding:8px 4px calc(8px + env(safe-area-inset-bottom));}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--muted);padding:6px 0;transition:color 0.2s;}
  .nav-item:hover{color:var(--primary);}
  .nav-item svg{width:22px;height:22px;}
  .nav-item span{font-size:0.7rem;font-weight:600;}
  .nav-item.active{color:var(--primary);}
  .nav-item.active .nav-icon-wrap{background:var(--primary);border-radius:10px;width:38px;height:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(92,61,244,0.3);}
  .nav-item.active .nav-icon-wrap svg{color:#fff;width:18px;height:18px;}
  .nav-icon-wrap{display:flex;align-items:center;justify-content:center;height:30px;}

  @media(max-width:480px){
    .toast-container{left:20px;right:20px;max-width:none;}
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="dashboard.html" class="back-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
  <div>
    <h1>Transaction History</h1>
    <p>All your activities in one place</p>
  </div>
</div>

<main>
  <div class="filter-tabs" id="filterTabs">
    <div class="filter-tab active" data-filter="all" onclick="setFilter('all')">All</div>
    <div class="filter-tab" data-filter="deposit" onclick="setFilter('deposit')">Deposits</div>
    <div class="filter-tab" data-filter="withdrawal" onclick="setFilter('withdrawal')">Withdrawals</div>
    <div class="filter-tab" data-filter="investment" onclick="setFilter('investment')">Investments</div>
    <div class="filter-tab" data-filter="roi" onclick="setFilter('roi')">ROI</div>
    <div class="filter-tab" data-filter="referral" onclick="setFilter('referral')">Referrals</div>
  </div>

  <div class="stats-row">
    <div class="stat-mini"><div class="sv" id="totalCredits">$0.00</div><div class="sl">Total Credits</div></div>
    <div class="stat-mini"><div class="sv" id="totalDebits">$0.00</div><div class="sl">Total Debits</div></div>
  </div>

  <div class="loading-state" id="loadingState">
    <div class="loading-spinner"></div>
    <p>Loading transactions...</p>
  </div>

  <div class="trans-list" id="transList" style="display:none;"></div>

  <div class="empty-state" id="emptyState" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <h3>No transactions found</h3>
    <p id="emptyMsg">You don't have any transactions yet.</p>
  </div>
</main>

<nav class="bottom-nav">
  <a href="dashboard.html" class="nav-item"><div class="nav-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div><span>Home</span></a>
  <a href="investment.html" class="nav-item"><div class="nav-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg></div><span>Orders</span></a>
  <a href="history.html" class="nav-item active"><div class="nav-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><span>History</span></a>
  <a href="profile.html" class="nav-item"><div class="nav-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><span>Account</span></a>
</nav>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ✅ UPDATED FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyAXVLeBN6rROvG6tEUN5WD8X1SZ4hatBxA",
    authDomain: "nexa-co.firebaseapp.com",
    projectId: "nexa-co",
    storageBucket: "nexa-co.firebasestorage.app",
    messagingSenderId: "345722583751",
    appId: "1:345722583751:web:b987628aa77bce38629ce2"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Toast notification system
  function showToast(type, title, message, duration = 4000) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    
    const icons = {
      success: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`,
      error: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
      info: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#5c3df4" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
      warning: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`
    };
    
    toast.innerHTML = `
      ${icons[type] || icons.info}
      <div class="toast-content">
        <div class="toast-title">${title}</div>
        <div class="toast-message">${message}</div>
      </div>
      <button class="toast-close" onclick="this.parentElement.remove()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    `;
    
    container.appendChild(toast);
    
    setTimeout(() => {
      toast.style.animation = 'slideOut 0.3s ease';
      setTimeout(() => toast.remove(), 300);
    }, duration);
  }

  window.showToast = showToast;

  let currentUser = null;
  let allTransactions = [];
  let currentFilter = 'all';

  const fu = n => (Number(n)||0).toFixed(2);
  const ff = n => Math.round(n||0).toLocaleString();

  function getTs(ts) {
    if (!ts) return 0;
    if (ts.toMillis) return ts.toMillis();
    if (ts.seconds) return ts.seconds * 1000;
    if (ts instanceof Date) return ts.getTime();
    if (typeof ts === 'number') return ts;
    return 0;
  }

  function formatDate(ts) {
    const ms = getTs(ts);
    if (!ms) return '—';
    const d = new Date(ms);
    const now = new Date();
    const diff = now - d;
    
    if (diff < 60000) return 'Just now';
    if (diff < 3600000) return Math.floor(diff/60000) + ' min ago';
    if (diff < 86400000 && d.getDate() === now.getDate()) return 'Today ' + d.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'});
    if (diff < 172800000) return 'Yesterday';
    
    return d.toLocaleDateString('en-US', {day:'numeric', month:'short', year:'numeric'}) + ' ' + d.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'});
  }

  function getIcon(type, subType) {
    if (type === 'deposit') return 'deposit';
    if (type === 'withdrawal') return 'withdrawal';
    if (type === 'investment') return 'investment';
    if (type === 'roi') return 'roi';
    if (type === 'referral') return 'referral';
    if (type === 'welcome') return 'welcome';
    return 'investment';
  }

  function getIconEmoji(type) {
    const icons = {
      deposit: '📥',
      withdrawal: '📤',
      investment: '💼',
      roi: '💰',
      referral: '🎁',
      welcome: '💎'
    };
    return icons[type] || '📄';
  }

  function getTitle(tx) {
    switch(tx.type) {
      case 'deposit':
        return tx.currency === 'NGN' ? 'Naira Deposit' : 'USDT Deposit';
      case 'withdrawal':
        return tx.currency === 'NGN' ? 'Bank Withdrawal' : 'USDT Withdrawal';
      case 'investment':
        return tx.planName ? `${tx.planName} Plan Investment` : 'Investment';
      case 'roi':
        return 'ROI Payout';
      case 'referral':
        return `Referral Bonus (Level ${tx.level || 1})`;
      case 'welcome':
        return 'Welcome Bonus';
      default:
        return 'Transaction';
    }
  }

  function getAmount(tx) {
    if (tx.type === 'deposit') {
      return { value: tx.amount || 0, type: 'debit', currency: tx.currency || 'USDT' };
    }
    if (tx.type === 'withdrawal') {
      return { value: tx.amount || 0, type: 'debit', currency: tx.currency || 'USDT' };
    }
    if (tx.type === 'investment') {
      return { value: tx.amount || 0, type: 'debit', currency: 'USDT' };
    }
    if (tx.type === 'roi') {
      return { value: tx.amount || tx.totalPaidOut || 0, type: 'credit', currency: 'USDT' };
    }
    if (tx.type === 'referral') {
      return { value: tx.bonus || tx.amount || 0, type: 'credit', currency: 'USDT' };
    }
    if (tx.type === 'welcome') {
      return { value: tx.amount || 0.35, type: 'credit', currency: 'USDT' };
    }
    return { value: 0, type: 'credit', currency: 'USDT' };
  }

  function getStatus(tx) {
    if (tx.type === 'investment') {
      if (tx.status === 'completed') return 'completed';
      if (tx.locked) return 'locked';
      return 'active';
    }
    return tx.status || 'completed';
  }

  function renderTransactions() {
    const list = document.getElementById('transList');
    const empty = document.getElementById('emptyState');
    
    const filtered = currentFilter === 'all' 
      ? allTransactions 
      : allTransactions.filter(tx => tx.type === currentFilter);

    if (filtered.length === 0) {
      list.style.display = 'none';
      empty.style.display = 'block';
      document.getElementById('emptyMsg').textContent = currentFilter === 'all' 
        ? 'You don\'t have any transactions yet.' 
        : `No ${currentFilter} transactions found.`;
      return;
    }

    empty.style.display = 'none';
    list.style.display = 'flex';
    
    list.innerHTML = filtered.map(tx => {
      const amount = getAmount(tx);
      const status = getStatus(tx);
      const statusClass = status === 'active' ? 'active' : status === 'locked' ? 'locked' : status === 'completed' ? 'completed' : status;
      
      const amountDisplay = tx.currency === 'NGN' 
        ? '₦' + ff(amount.value)
        : '$' + fu(amount.value);

      return `
        <div class="trans-card">
          <div class="trans-icon ${getIcon(tx.type)}">${getIconEmoji(tx.type)}</div>
          <div class="trans-info">
            <div class="trans-title">${getTitle(tx)}</div>
            <div class="trans-date">${formatDate(tx.createdAt)}</div>
          </div>
          <div class="trans-amount">
            <div class="amt ${amount.type}">${amount.type === 'credit' ? '+' : '-'}${amountDisplay}</div>
            <span class="status ${statusClass}">${status.charAt(0).toUpperCase() + status.slice(1)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function updateStats() {
    let credits = 0, debits = 0;
    allTransactions.forEach(tx => {
      const amount = getAmount(tx);
      if (amount.type === 'credit') credits += amount.value;
      else debits += amount.value;
    });
    document.getElementById('totalCredits').textContent = '$' + fu(credits);
    document.getElementById('totalDebits').textContent = '$' + fu(debits);
  }

  window.setFilter = (filter) => {
    currentFilter = filter;
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.filter === filter);
    });
    renderTransactions();
    showToast('info', 'Filter Applied', `Showing ${filter === 'all' ? 'all transactions' : filter + 's'}`);
  };

  async function loadTransactions() {
    if (!currentUser) return;
    
    const loading = document.getElementById('loadingState');
    loading.style.display = 'block';
    
    try {
      allTransactions = [];
      
      // ✅ Fetch deposits (client-side filtering, no composite index)
      const depSnap = await getDocs(query(collection(db, 'deposits'), where('userId', '==', currentUser.uid)));
      depSnap.forEach(doc => {
        const d = doc.data();
        allTransactions.push({
          id: doc.id,
          type: 'deposit',
          amount: d.amount,
          currency: d.currency || 'USDT',
          status: d.status || 'pending',
          createdAt: d.createdAt,
          depositType: d.depositType
        });
      });

      // ✅ Fetch withdrawals
      const withSnap = await getDocs(query(collection(db, 'withdrawals'), where('userId', '==', currentUser.uid)));
      withSnap.forEach(doc => {
        const d = doc.data();
        allTransactions.push({
          id: doc.id,
          type: 'withdrawal',
          amount: d.amount,
          currency: d.currency || 'USDT',
          status: d.status || 'pending',
          createdAt: d.createdAt,
          withdrawalType: d.type
        });
      });

      // ✅ Fetch investments
      const invSnap = await getDocs(query(collection(db, 'investments'), where('userId', '==', currentUser.uid)));
      invSnap.forEach(doc => {
        const d = doc.data();
        allTransactions.push({
          id: doc.id,
          type: 'investment',
          amount: d.amount,
          currency: 'USDT',
          status: d.status || 'active',
          createdAt: d.createdAt,
          planName: d.planName,
          locked: d.locked
        });
        
        // Add ROI earned as separate transaction
        if (d.totalPaidOut && d.totalPaidOut > 0) {
          allTransactions.push({
            id: doc.id + '-roi',
            type: 'roi',
            amount: d.totalPaidOut,
            currency: 'USDT',
            status: 'completed',
            createdAt: d.lastPayoutDate || d.createdAt,
            planName: d.planName
          });
        }
      });

      // ✅ Fetch referral logs
      const refSnap = await getDocs(query(collection(db, 'referralLogs'), where('fromUserId', '==', currentUser.uid)));
      refSnap.forEach(doc => {
        const d = doc.data();
        allTransactions.push({
          id: doc.id,
          type: 'referral',
          amount: d.bonus,
          currency: 'USDT',
          status: 'completed',
          createdAt: d.createdAt,
          level: d.level,
          planName: d.planName
        });
      });

      // ✅ Sort by date (newest first) - client-side sorting
      allTransactions.sort((a, b) => getTs(b.createdAt) - getTs(a.createdAt));

      loading.style.display = 'none';
      updateStats();
      renderTransactions();
      
      if (allTransactions.length > 0) {
        showToast('success', 'Transactions Loaded', `Found ${allTransactions.length} transaction(s).`);
      }
    } catch (e) {
      console.error('Error loading transactions:', e);
      loading.style.display = 'none';
      document.getElementById('emptyState').style.display = 'block';
      document.getElementById('emptyMsg').textContent = 'Failed to load transactions. Please try again.';
      showToast('error', 'Error', 'Failed to load transactions.');
    }
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }
    currentUser = user;
    await loadTransactions();
  });

  // Refresh every 2 minutes
  setInterval(() => {
    if (currentUser) loadTransactions();
  }, 120000);
</script>
</body>
</html>
