<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Nexa – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f3fa;
      --card: #ffffff;
      --primary: #5c3df4;
      --primary-dark: #4528d4;
      --primary-soft: #ede9ff;
      --accent: #a78bfa;
      --accent-gold: #f59e0b;
      --text: #1a1533;
      --muted: #7b7694;
      --border: #e3e0f5;
      --input-bg: #f8f7ff;
      --success: #16a34a;
      --error: #dc2626;
      --banner-bg: linear-gradient(135deg, #1e1445 0%, #3b1fa8 100%);
      --shadow: 0 8px 32px -8px rgba(92, 61, 244, 0.18);
    }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--text);
      background-image: 
        radial-gradient(ellipse at 20% 20%, rgba(92,61,244,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(167,139,250,0.06) 0%, transparent 50%);
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(92,61,244,0.3);
    }
    .logo-icon svg { width: 21px; height: 21px; }
    .logo-name {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
    }
    .logo-name span { color: var(--primary); }

    .btn-signup {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-soft);
      border: 1.5px solid transparent;
      border-radius: 50px;
      padding: 9px 24px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-signup:hover { background: #ddd6fe; transform: translateY(-1px); }

    main {
      flex: 1;
      padding: 40px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .banner {
      width: 100%;
      max-width: 440px;
      background: var(--banner-bg);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .banner::before {
      content: '';
      position: absolute;
      top: -40px;
      right: -40px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(167,139,250,0.1);
    }
    .banner::after {
      content: '';
      position: absolute;
      bottom: -30px;
      left: 30%;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(245,158,11,0.1);
    }
    .banner-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: rgba(167, 139, 250, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    .banner-icon svg { width: 28px; height: 28px; color: var(--accent); }
    .banner-text { position: relative; z-index: 1; }
    .banner-text h2 { font-size: 1.1rem; font-weight: 700; color: #ffffff; margin-bottom: 4px; }
    .banner-text p { font-size: 0.85rem; color: rgba(255,255,255,0.72); line-height: 1.4; }
    .banner-text p strong { color: #fbbf24; font-weight: 700; }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border-radius: 24px;
      padding: 32px 24px 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .card h1 { font-size: 1.5rem; font-weight: 800; color: var(--text); margin-bottom: 4px; letter-spacing: -0.5px; }
    .card .subtitle { font-size: 0.9rem; color: var(--muted); margin-bottom: 24px; }

    .field { position: relative; margin-bottom: 16px; }
    .field-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #b3aed4; display: flex; pointer-events: none; z-index: 1; }
    .field-icon svg { width: 20px; height: 20px; }

    .field input {
      width: 100%; height: 52px; background: var(--input-bg); border: 2px solid var(--border);
      border-radius: 14px; padding: 0 16px 0 48px; font-family: inherit; font-size: 0.95rem;
      color: var(--text); outline: none; transition: all 0.2s;
    }
    .field input::placeholder { color: #b3aed4; font-size: 0.9rem; }
    .field input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(92,61,244,0.08); }
    .field input.error { border-color: var(--error); background: #fef2f2; }

    .toggle-pw { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #b3aed4; display: flex; padding: 8px; z-index: 1; }
    .toggle-pw:hover { color: var(--primary); }
    .toggle-pw svg { width: 20px; height: 20px; }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .remember-me input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--primary);
    }
    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }
    .forgot-link:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }

    .btn-login {
      width: 100%; height: 54px; background: var(--primary); color: #fff; font-family: inherit;
      font-size: 1rem; font-weight: 700; border: none; border-radius: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.2s; letter-spacing: 0.2px; box-shadow: 0 4px 16px rgba(92,61,244,0.3);
    }
    .btn-login:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(92,61,244,0.4); }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-login svg { width: 20px; height: 20px; }

    .signup-link { text-align: center; font-size: 0.9rem; color: var(--muted); margin-top: 20px; }
    .signup-link a { color: var(--primary); font-weight: 700; text-decoration: none; transition: color 0.2s; }
    .signup-link a:hover { color: var(--primary-dark); text-decoration: underline; }

    .spinner { width: 20px; height: 20px; border: 2.5px solid rgba(255,255,255,0.35); border-top-color: #fff; border-radius: 50%; animation: spin 600ms linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast Notifications */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 350px;
    }
    .toast {
      background: var(--card);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      gap: 12px;
      animation: slideIn 0.3s ease;
      border-left: 4px solid;
      position: relative;
      overflow: hidden;
    }
    .toast.success { border-left-color: var(--success); }
    .toast.error { border-left-color: var(--error); }
    .toast.info { border-left-color: var(--primary); }
    .toast.warning { border-left-color: var(--accent-gold); }
    
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideOut {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(100%); opacity: 0; }
    }
    .toast-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }
    .toast-content {
      flex: 1;
    }
    .toast-title {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text);
      margin-bottom: 2px;
    }
    .toast-message {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .toast-close {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      flex-shrink: 0;
    }
    .toast-close:hover { color: var(--text); }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(20,12,50,0.6); backdrop-filter: blur(6px); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.show { display: flex; }
    .modal { background: var(--card); border-radius: 24px; padding: 32px 26px 26px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(92,61,244,0.3); animation: modalIn 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.85) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .modal-icon { width: 68px; height: 68px; border-radius: 50%; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center; }
    .modal-icon.success { background: #dcfce7; } .modal-icon.error { background: #fee2e2; } .modal-icon.info { background: var(--primary-soft); }
    .modal-icon svg { width: 34px; height: 34px; }
    .modal h3 { font-size: 1.2rem; font-weight: 800; color: var(--text); margin-bottom: 8px; }
    .modal p { font-size: 0.9rem; color: var(--muted); line-height: 1.6; margin-bottom: 22px; }
    .modal-btn { width: 100%; padding: 14px; border: none; border-radius: 13px; font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s; background: var(--primary); color: #fff; }
    .modal-btn:hover { background: var(--primary-dark); }

    @media(max-width:480px){
      .toast-container { left: 20px; right: 20px; max-width: none; }
    }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </div>
    <span class="logo-name">Nex<span>a</span></span>
  </a>
  <a href="index.html" class="btn-signup">Sign up</a>
</nav>

<main>
  <div class="banner">
    <div class="banner-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
      </svg>
    </div>
    <div class="banner-text">
      <h2>Welcome back!</h2>
      <p>Login to access your <strong>Nexa account</strong> and continue earning.</p>
    </div>
  </div>

  <div class="card">
    <h1>Sign in</h1>
    <p class="subtitle">Enter your credentials to continue.</p>

    <div class="field">
      <span class="field-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
        </svg>
      </span>
      <input type="email" id="email" placeholder="Email address" autocomplete="email" />
    </div>

    <div class="field">
      <span class="field-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
      </span>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
      <button class="toggle-pw" onclick="togglePw('password', this)" tabindex="-1" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <div class="remember-row">
      <label class="remember-me">
        <input type="checkbox" id="rememberMe" checked />
        <span>Remember me</span>
      </label>
      <a href="#" class="forgot-link" onclick="forgotPassword(event)">Forgot password?</a>
    </div>

    <button class="btn-login" id="loginBtn" onclick="handleLogin()">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Sign in</span>
      <svg id="btnArrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
      </svg>
    </button>

    <p class="signup-link">Don't have an account? <a href="index.html">Sign up</a></p>
  </div>
</main>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-icon" id="modalIcon"></div>
    <h3 id="modalTitle"></h3>
    <p id="modalMsg"></p>
    <button class="modal-btn" onclick="closeModal()">OK</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence, browserSessionPersistence, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ✅ UPDATED FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyAXVLeBN6rROvG6tEUN5WD8X1SZ4hatBxA",
    authDomain: "nexa-co.firebaseapp.com",
    projectId: "nexa-co",
    storageBucket: "nexa-co.firebasestorage.app",
    messagingSenderId: "345722583751",
    appId: "1:345722583751:web:b987628aa77bce38629ce2"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Toast notification system
  function showToast(type, title, message, duration = 4000) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    
    const icons = {
      success: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`,
      error: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
      info: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#5c3df4" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
      warning: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`
    };
    
    toast.innerHTML = `
      ${icons[type] || icons.info}
      <div class="toast-content">
        <div class="toast-title">${title}</div>
        <div class="toast-message">${message}</div>
      </div>
      <button class="toast-close" onclick="this.parentElement.remove()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    `;
    
    container.appendChild(toast);
    
    setTimeout(() => {
      toast.style.animation = 'slideOut 0.3s ease';
      setTimeout(() => toast.remove(), 300);
    }, duration);
  }

  const ICONS = {
    success: `<svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`,
    error: `<svg viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
    info: `<svg viewBox="0 0 24 24" fill="none" stroke="#5c3df4" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`
  };

  function showModal(type, title, msg, onClose) {
    document.getElementById('modalIcon').className = 'modal-icon ' + type;
    document.getElementById('modalIcon').innerHTML = ICONS[type];
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMsg').innerHTML = msg;
    document.getElementById('modalOverlay').classList.add('show');
    window._modalOnClose = onClose || null;
  }

  window.closeModal = function() {
    document.getElementById('modalOverlay').classList.remove('show');
    if (window._modalOnClose) { window._modalOnClose(); window._modalOnClose = null; }
  };

  function setLoading(loading) {
    const btn = document.getElementById('loginBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    const btnArrow = document.getElementById('btnArrow');
    btn.disabled = loading;
    spinner.style.display = loading ? 'block' : 'none';
    btnArrow.style.display = loading ? 'none' : 'block';
    btnText.textContent = loading ? 'Signing in…' : 'Sign in';
  }

  function friendlyError(code) {
    const map = {
      'auth/user-not-found': 'No account found with this email.',
      'auth/wrong-password': 'Incorrect password. Please try again.',
      'auth/invalid-email': 'Please enter a valid email address.',
      'auth/invalid-credential': 'Invalid email or password.',
      'auth/too-many-requests': 'Too many failed attempts. Please try again later.',
      'auth/network-request-failed': 'Network error. Check your connection.',
      'auth/user-disabled': 'This account has been disabled.',
    };
    return map[code] || 'Login failed. Please try again.';
  }

  // Check if user is already logged in
  auth.onAuthStateChanged((user) => {
    if (user) {
      showToast('info', 'Already Logged In', 'Redirecting to dashboard...');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1000);
    }
  });

  window.handleLogin = async function() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const rememberMe = document.getElementById('rememberMe').checked;

    if (!email) {
      showToast('warning', 'Email Required', 'Please enter your email address.');
      return showModal('info', 'Email required', 'Please enter your email address.');
    }
    if (!password) {
      showToast('warning', 'Password Required', 'Please enter your password.');
      return showModal('info', 'Password required', 'Please enter your password.');
    }

    setLoading(true);
    showToast('info', 'Signing In', 'Please wait...');

    try {
      // Set persistence based on "Remember me" checkbox
      await setPersistence(auth, rememberMe ? browserLocalPersistence : browserSessionPersistence);
      
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // Check if user exists in Firestore
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      
      if (userDoc.exists()) {
        const userData = userDoc.data();
        
        setLoading(false);
        showToast('success', 'Login Successful! 🎉', 'Welcome back to Nexa!');
        
        showModal('success', 'Welcome back! 🎉', 
          `You've successfully logged in. Your withdrawal wallet balance is <strong>$${userData.withdrawalWallet?.toFixed(2) || '0.00'}</strong>.`,
          () => { window.location.href = 'dashboard.html'; }
        );
      } else {
        // User exists in Auth but not in Firestore
        setLoading(false);
        showToast('error', 'Account Error', 'Account data not found. Please contact support.');
        showModal('error', 'Account Error', 'Your account data is incomplete. Please contact support.');
      }
    } catch (err) {
      setLoading(false);
      const errorMsg = friendlyError(err.code);
      showToast('error', 'Login Failed', errorMsg);
      showModal('error', 'Login failed', errorMsg);
      
      // Add error styling to inputs
      if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-email') {
        document.getElementById('email').classList.add('error');
      }
      if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
        document.getElementById('password').classList.add('error');
      }
    }
  };

  // Remove error styling on input
  document.getElementById('email').addEventListener('input', function() {
    this.classList.remove('error');
  });
  document.getElementById('password').addEventListener('input', function() {
    this.classList.remove('error');
  });

  // Forgot password function
  window.forgotPassword = async function(event) {
    event.preventDefault();
    const email = document.getElementById('email').value.trim();
    
    if (!email) {
      showToast('warning', 'Email Required', 'Please enter your email address first.');
      return showModal('info', 'Email required', 'Please enter your email address to reset your password.');
    }

    showToast('info', 'Sending Reset Email', 'Please wait...');

    try {
      await sendPasswordResetEmail(auth, email);
      showToast('success', 'Reset Email Sent', 'Check your inbox for password reset instructions.');
      showModal('success', 'Reset email sent!', 'We\'ve sent a password reset link to your email address. Please check your inbox.');
    } catch (err) {
      const errorMsg = friendlyError(err.code);
      showToast('error', 'Reset Failed', errorMsg);
      showModal('error', 'Reset failed', errorMsg);
    }
  };

  // Enter key to submit
  document.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      handleLogin();
    }
  });
</script>
